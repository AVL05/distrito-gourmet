services:
  db:
    image: mysql:8.0
    container_name: distrito-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-distrito_gourmet}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configure DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME:-distrito_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: distrito-backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-distrito_gourmet}
      DB_USERNAME: ${DB_USERNAME:-distrito_user}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
      TRUSTED_PROXIES: REMOTE_ADDR
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: distrito-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
